[project]
name = "svdeck"
version = "0.1.0"
description = "Shadowverse: Worlds Beyond デッキ制作支援システムのデータ取得層"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
svdeck = ["journal_web/*.html", "journal_web/*.css", "journal_web/*.js", "data/experiment_catalog.json"]

[tool.mypy]
strict = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
