[project]
name = "svdeck"
version = "0.1.0"
description = "Shadowverse: Worlds Beyond デッキ制作支援システムのデータ取得層"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1"]
performance = ["numba>=0.67,<0.68", "numpy>=2,<2.6"]

[project.scripts]
svdeck-battle = "svdeck.battle:main"
svdeck-battle-web = "svdeck.battle_server:main"
svdeck-battle-ai = "svdeck.battle_training:main"
svdeck-combat-benchmark = "svdeck.combat_benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
svdeck = ["journal_web/*.html", "journal_web/*.css", "journal_web/*.js", "data/experiment_catalog.json", "data/battle_cases.json", "data/battle_supported.json", "data/battle_decks.json", "data/battle_meta_cases.json", "data/battle_example_replay.json", "data/battle_ai_model.json", "data/battle_ai_replay.json", "data/combat_benchmark_cases.json", "battle_web/*.html", "battle_web/*.css", "battle_web/*.js"]

[tool.mypy]
strict = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
